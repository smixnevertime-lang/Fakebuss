<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WebView SMS Interface</title>
    <style>
        /* Сброс базовых стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent; 
        }

        /* ЖЕСТКАЯ ФИКСАЦИЯ РАМОК ДЛЯ WEBVIEW */
        html, body {
            background-color: #111114;
            width: 100%;
            height: 100%;
            position: fixed; /* Полностью блокирует сдвиги и pull-to-refresh браузера */
            top: 0;
            left: 0;
            overflow: hidden; /* Запрещает любой скролл на уровне всего документа */
        }

        .app-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* --- Header / App Bar --- */
        .header {
            display: flex;
            align-items: center;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 12px 16px;
            background-color: #1a1a1c;
            color: #ffffff;
            z-index: 10;
            flex-shrink: 0;
            width: 100%;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #e3e3e3;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-btn svg {
            fill: currentColor;
            width: 24px;
            height: 24px;
        }

        .profile-section {
            display: flex;
            align-items: center;
            flex: 1;
            margin-left: 8px;
            min-width: 0; /* Предотвращает разрыв flex-контейнера */
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #f35b96;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .avatar svg {
            fill: #1a1a1c;
            width: 28px;
            height: 28px;
            margin-top: 4px;
        }

        .contact-name {
            font-size: 18px;
            font-weight: 400;
            color: #f1f1f1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Chat Area --- */
        .chat-area {
            flex: 1;
            background-color: #111114;
            padding: 16px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden; /* Строго блокируем горизонтальный скролл внутри чата */
            -webkit-overflow-scrolling: touch; 
            scroll-behavior: smooth;
            width: 100%;
        }

        .chat-area::-webkit-scrollbar {
            display: none;
        }
        .chat-area {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .system-info {
            text-align: center;
            margin: 24px 0;
            animation: fadeIn 0.3s ease-in;
            width: 100%;
        }

        .date-text {
            color: #9e9ea0;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .sms-type-text {
            color: #c4c4c6;
            font-size: 13px;
        }

        /* Message Bubble */
        .message-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 8px;
            animation: slideUp 0.3s ease-out;
            max-width: 100%;
        }

        .message-row.sent {
            align-items: flex-end;
        }

        .message-row.received {
            align-items: flex-start;
        }

        .message-bubble {
            padding: 12px 16px;
            font-size: 16px;
            line-height: 1.4;
            max-width: 85%;
            word-wrap: break-word;
            word-break: break-word; /* Жестко переносить длинные строки */
            overflow-wrap: break-word;
        }

        .sent .message-bubble {
            background-color: #a4c8fb;
            color: #1a1a1c;
            border-radius: 20px 20px 4px 20px;
        }

        .received .message-bubble {
            background-color: #2a2a2e;
            color: #e6e6e6;
            border-radius: 20px 20px 20px 4px;
        }

        .ticket-date {
            text-decoration: underline;
        }

        /* --- Input Area --- */
        .input-area {
            background-color: #1a1a1c;
            padding: 10px 16px calc(env(safe-area-inset-bottom, 0px) + 12px) 16px;
            display: flex;
            align-items: flex-end;
            gap: 12px;
            z-index: 10;
            flex-shrink: 0;
            width: 100%;
        }

        .input-pill {
            flex: 1;
            background-color: #29292c;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 6px 6px 6px 12px;
            min-height: 48px;
            min-width: 0;
        }

        .plus-icon {
            color: #e3e3e3;
            margin-right: 8px;
            display: flex;
            flex-shrink: 0;
        }

        .plus-icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.5;
        }

        .message-input {
            flex: 1;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 16px;
            outline: none;
            padding: 8px 0;
            min-width: 0;
        }

        .message-input::placeholder {
            color: #a0a0a2;
        }

        .input-actions {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        .input-actions .icon-btn {
            padding: 8px;
            color: #a0a0a2;
        }

        .input-actions .icon-btn svg {
            width: 22px;
            height: 22px;
        }

        /* Send Button */
        .send-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: #a4c8fb;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.1s;
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }

        .send-btn svg {
            fill: #0d2b5e;
            width: 20px;
            height: 20px;
            margin-bottom: 2px;
            margin-left: 2px;
        }

        .send-text {
            font-size: 9px;
            font-weight: bold;
            color: #0d2b5e;
            line-height: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <!-- Header -->
    <div class="header">
        <button class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        </button>
        <div class="profile-section">
            <div class="avatar">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            </div>
            <div class="contact-name">4000</div>
        </div>
        <button class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
        </button>
        <button class="icon-btn">
            <svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </button>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea">
        <!-- Сообщения подгружаются динамически -->
    </div>

    <!-- Input Area -->
    <div class="input-area">
        <div class="input-pill">
            <div class="plus-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="16"></line>
                    <line x1="8" y1="12" x2="16" y2="12"></line>
                </svg>
            </div>
            <input type="number" inputmode="numeric" class="message-input" id="messageInput" placeholder="Введите номер борта" autocomplete="off">
            <div class="input-actions">
                <button class="icon-btn">
                    <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                </button>
            </div>
        </div>
        
        <!-- Send Button -->
        <button class="send-btn" id="sendBtn">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
            <span class="send-text">SMS</span>
        </button>
    </div>

</div>

<script>
    const chatArea = document.getElementById('chatArea');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    
    let lastMessageDateStr = null;
    const daysOfWeek = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];

    function formatTime(date) {
        return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function formatDate(date) {
        const dd = String(date.getDate()).padStart(2, '0');
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const yyyy = date.getFullYear();
        return `${dd}.${mm}.${yyyy}`;
    }

    function scrollToBottom() {
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    window.addEventListener('resize', () => {
        setTimeout(scrollToBottom, 50);
    });

    function addSystemDateIfNewDay(now) {
        const currentDateStr = formatDate(now);
        
        if (lastMessageDateStr !== currentDateStr) {
            const dayName = daysOfWeek[now.getDay()];
            const timeStr = formatTime(now);
            
            const systemDiv = document.createElement('div');
            systemDiv.className = 'system-info';
            systemDiv.innerHTML = `
                <div class="date-text">${dayName} • ${timeStr}</div>
                <div class="sms-type-text">SMS/MMS абоненту 4002</div>
            `;
            chatArea.appendChild(systemDiv);
            
            lastMessageDateStr = currentDateStr;
        }
    }

    function renderSentMessage(text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message-row sent';
        
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.textContent = text;
        
        msgDiv.appendChild(bubble);
        chatArea.appendChild(msgDiv);
        scrollToBottom();
    }

    function renderReceivedMessage(boardNumber, dateObj, ticketNumber) {
        const dateTimeStr = `${formatDate(dateObj)} ${formatTime(dateObj)}`;
        
        // Проверка: если сообщение состоит строго из 3 цифр — IM IPUA, иначе IM RTEC
        const companyHeader = /^\d{3}$/.test(boardNumber.trim()) ? 'IM IPUA' : 'IM RTEC';

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message-row received';
        msgDiv.innerHTML = `
            <div class="message-bubble">
                ${companyHeader}<br><br>
                Bilet Nr ${ticketNumber}<br><br>
                <span class="ticket-date">${dateTimeStr}</span><br><br>
                Pret 7 MDL<br><br>
                Bord ${boardNumber}
            </div>
        `;
        chatArea.appendChild(msgDiv);
        scrollToBottom();
    }

    function saveMessageToStorage(type, data) {
        const history = JSON.parse(localStorage.getItem('sms_history') || '[]');
        history.push({ type, data, timestamp: new Date().toISOString() });
        localStorage.setItem('sms_history', JSON.stringify(history));
    }

    function loadHistory() {
        const history = JSON.parse(localStorage.getItem('sms_history') || '[]');
        
        chatArea.innerHTML = '';
        lastMessageDateStr = null;

        history.forEach(item => {
            const dateObj = new Date(item.timestamp);
            addSystemDateIfNewDay(dateObj);

            if (item.type === 'sent') {
                renderSentMessage(item.data);
            } else if (item.type === 'received') {
                renderReceivedMessage(item.data.boardNumber, dateObj, item.data.ticketNumber);
            }
        });
        scrollToBottom();
    }

    function handleSend() {
        const text = messageInput.value.trim();
        if (!text) return;

        const now = new Date();
        addSystemDateIfNewDay(now);

        renderSentMessage(text);
        saveMessageToStorage('sent', text);
        
        messageInput.value = '';
        messageInput.focus();

        setTimeout(() => {
            const randomNum = Math.floor(100000 + Math.random() * 900000);
            const ticketNumber = `MCT-000${randomNum}`;
            
            renderReceivedMessage(text, now, ticketNumber);
            saveMessageToStorage('received', {
                boardNumber: text,
                ticketNumber: ticketNumber
            });
        }, 600);
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadHistory();
    });

    sendBtn.addEventListener('click', handleSend);
    
    messageInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            handleSend();
        }
    });
</script>
</body>
</html>
